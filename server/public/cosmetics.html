<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmetics · Astra</title>
<meta name="description" content="Every cape and wing on Astra. Equip them from the app, in game or here.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header data-nav></header>
<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Cosmetics</p>
      <h1>Capes and wings</h1>
      <p>Everything you can wear on Astra. What you equip is saved to your account, so every Astra player sees it on you in game.</p>
    </div>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Filter">
        <button class="tab" role="tab" data-filter="all" aria-selected="true">All</button>
        <button class="tab" role="tab" data-filter="cape" aria-selected="false">Capes</button>
        <button class="tab" role="tab" data-filter="wings" aria-selected="false">Wings</button>
      </div>
      <p class="muted" data-note></p>
    </div>
    <div class="cos-grid" data-grid aria-live="polite"><div class="empty" style="grid-column:1/-1">Loading…</div></div>
  </div>
</main>
<footer data-footer></footer>
<script type="module" src="/assets/js/pages/cosmetics.js"></script>
</body>
</html>
