<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Players · Astra</title>
<meta name="description" content="How many players are on Astra right now, and which of your friends are in game.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header data-nav></header>
<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Players</p>
      <h1>Who's online</h1>
      <p>Your friends with Astra open, and the server they're on. Search any name to open their profile.</p>
    </div>
    <div class="online-total" aria-live="polite"><span class="dot on"></span><b data-total>–</b> <span data-total-label>players online on Astra</span></div>
    <form class="finder" data-find role="search">
      <input type="search" name="q" placeholder="Search a Minecraft name" aria-label="Minecraft name" maxlength="16" autocomplete="off">
      <button class="btn btn-primary" type="submit">Find</button>
    </form>
    <h2 class="list-title">Friends online <span class="muted" data-count></span></h2>
    <div class="people" data-online aria-live="polite"><div class="empty" style="grid-column:1/-1">Loading…</div></div>
  </div>
</main>
<footer data-footer></footer>
<script type="module" src="/assets/js/pages/players.js"></script>
</body>
</html>
