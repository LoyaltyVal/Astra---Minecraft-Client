<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Players · Astra</title>
<meta name="description" content="Find Astra players and see which server they're on.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header data-nav></header>
<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Players</p>
      <h1>Find a player</h1>
      <p>Everyone playing on Astra right now and the server they're on. Players can hide their server in game (Right Shift → Cosmetics → Options).</p>
    </div>
    <form class="finder" data-find role="search">
      <input type="search" name="q" placeholder="Search a Minecraft name" aria-label="Minecraft name" maxlength="16" autocomplete="off">
      <button class="btn btn-primary" type="submit">Find</button>
    </form>
    <div class="servers" data-servers></div>
    <h2 class="list-title"><span class="dot on"></span> In game now <span class="muted" data-count></span></h2>
    <div class="people" data-online aria-live="polite"><div class="empty" style="grid-column:1/-1">Loading…</div></div>
  </div>
</main>
<footer data-footer></footer>
<script type="module" src="/assets/js/pages/players.js"></script>
</body>
</html>
