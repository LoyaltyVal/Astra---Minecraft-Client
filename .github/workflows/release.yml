# Builds Astra for Windows, macOS and Linux and publishes a GitHub Release. Installed launchers
# update themselves from the newest release, and download the newest Astra mod from it.
#
# A release is made automatically every time you push to main (client and launcher changes only;
# edits to docs, the website, the server or the .bat files don't make one). The version is the one in launcher/package.json
# with the build number added, e.g. 1.0.1 -> 1.0.<1 + run number>, so every release is newer than
# the last. To pick the version yourself, push a tag instead: git tag v1.2.0 && git push origin v1.2.0
# (or run the workflow from the Actions tab).
#
# Settings → Secrets and variables → Actions (all optional):
#   Variable ASTRA_SERVER_URL   a permanent Astra server address to put in the launcher. Leave it
#                               unset while you only have a temporary (trycloudflare) address.
#   Signing turns on when its secrets are set (see launcher/electron-builder.config.js):
#     Windows, Azure Artifact Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#       ASTRA_AZURE_ENDPOINT, ASTRA_AZURE_ACCOUNT, ASTRA_AZURE_PROFILE, ASTRA_PUBLISHER_NAME
#     Windows, .pfx: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#     macOS: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'server/**'
      - 'tools/**'
      - '*.bat'
      - '*.command'
      - '*.sh'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a newer push waits for the one being built.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Work out the version
        run: |
          BASE=$(node -p "require('./launcher/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag ${GITHUB_REF_NAME} isn't a version like v1.2.0."; exit 1
            fi
          else
            MAJOR_MINOR="${BASE%.*}"
            PATCH="${BASE##*.}"
            VERSION="${MAJOR_MINOR}.$((PATCH + GITHUB_RUN_NUMBER))"
          fi
          echo "Releasing Astra $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Server address (optional)
        env:
          URL: ${{ vars.ASTRA_SERVER_URL }}
        run: |
          case "$URL" in
            "") echo "::notice::No ASTRA_SERVER_URL set: players type their Astra server address in Settings.";;
            *trycloudflare.com*) echo "::warning::ASTRA_SERVER_URL is a temporary quick-tunnel address, so it isn't put in the launcher.";;
            *) echo "Launcher will use $URL";;
          esac

  mods:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Astra (1.8.9, 1.7.10 and every finished version)
        run: sh ./gradlew build --no-daemon --console=plain
      - name: Build the versions still being ported (each one may fail without stopping the release)
        run: |
          for props in versions/*/gradle.properties; do
            v=$(basename "$(dirname "$props")")
            grep -q '^astra_experimental=true' "$props" || continue
            if sh ./gradlew -Pastra_experimental_versions=true ":versions:$v:build" --no-daemon --console=plain; then
              echo "::notice::Built Astra for $v"
            else
              echo "::warning::Astra for $v didn't build; this release doesn't include it."
            fi
          done
      - name: List the builds for the launcher (astra-mods.json)
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mkdir -p release-mods
          node tools/github/release-mods.js "$MOD_VERSION" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-mods
          path: release-mods/
          if-no-files-found: error

  draft:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Astra $TAG" --generate-notes --target "$GITHUB_SHA"

  launcher:
    needs: [check, mods, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mods
          path: versions
      - name: Set the version and server address
        shell: bash
        env:
          URL: ${{ vars.ASTRA_SERVER_URL }}
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: launcher
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          case "$URL" in
            ""|*trycloudflare.com*) ;;
            *) node -e "require('fs').writeFileSync('build-config.json', JSON.stringify({ serverUrl: process.env.URL.replace(/\/+$/, '') }, null, 2) + '\n')";;
          esac
      - name: Install
        working-directory: launcher
        run: npm install --no-audit --no-fund
      - name: Build and upload
        working-directory: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRA_RELEASE_TYPE: draft
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ASTRA_AZURE_ENDPOINT: ${{ secrets.ASTRA_AZURE_ENDPOINT }}
          ASTRA_AZURE_ACCOUNT: ${{ secrets.ASTRA_AZURE_ACCOUNT }}
          ASTRA_AZURE_PROFILE: ${{ secrets.ASTRA_AZURE_PROFILE }}
          ASTRA_PUBLISHER_NAME: ${{ secrets.ASTRA_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/copy-mods.js
          npx electron-builder ${{ matrix.target }} --config electron-builder.config.js --publish always

  publish:
    needs: [check, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-mods
          path: release-mods
      - name: Add the Astra mods and publish the release (launchers start updating now)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release upload "$TAG" release-mods/* --clobber
          gh release edit "$TAG" --draft=false --latest
