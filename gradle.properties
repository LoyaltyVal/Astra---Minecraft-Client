org.gradle.jvmargs=-Xmx2G
# Two Loom projects in one build: keep them from fighting over the Minecraft cache.
org.gradle.parallel=false

# Toolchain (values from the official Legacy Fabric example mod)
loom_version=1.16-SNAPSHOT
loader_version=0.18.3

# Versions still being ported (astra_experimental=true in their folder) are skipped unless this is true.
astra_experimental_versions=false

# Mod
mod_version=1.0.0
maven_group=dev.astra
archives_base_name=astra
