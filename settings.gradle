pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Legacy Fabric"
            url = "https://maven.legacyfabric.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
        id "legacy-looming" version "${loom_version}" // must match fabric-loom's version
    }
}

rootProject.name = "astra-client"

// One subproject per Minecraft version. They all share the code in /common.
// A version whose gradle.properties says astra_experimental=true is only built when
// astra_experimental_versions=true (gradle.properties, or -Pastra_experimental_versions=true), so a
// version still being ported can never break the build of the ones players use.
def experimentalOn = providers.gradleProperty("astra_experimental_versions").getOrElse("false") == "true"
file("versions").listFiles().findAll { it.isDirectory() && new File(it, "build.gradle").exists() }.sort().each { dir ->
    def props = new Properties()
    def propsFile = new File(dir, "gradle.properties")
    if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
    if (props.getProperty("astra_experimental") != "true" || experimentalOn) {
        include "versions:${dir.name}"
    }
}
